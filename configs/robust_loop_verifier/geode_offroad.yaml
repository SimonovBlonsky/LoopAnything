dataset_name: GEODE
platform: Offroad
input_root: /data/datasets/GEODE/geode_loop_dataset
gt_root: /data/datasets/GEODE/data/offroad
output_root: /data/datasets/GEODE/robust_loop_verifier_cache
positive_radius_m: 2.0
positive_max_rotation_deg: 45.0
recent_exclusion_keyframes: 30
retrieval_top_k_main: 10
retrieval_top_k_ablations: [5, 20]
support_window: 4
support_count: 1
min_support_baseline_m: 0.3
support_ensemble:
  enabled: false
  support_count: 1
  sigma_rot_floor: 0.05
  sigma_trans_floor: 0.25
  covariance_scale: 1.0
  c_align: 1.0
  c_consensus: 2.0
  lambda_dir: 1.0
  robust_iterations: 3
pgo_noise:
  prior_sigmas: [0.01, 0.01, 0.01, 0.1, 0.1, 0.1]
  odom_sigmas: [0.05, 0.05, 0.05, 0.5, 0.5, 0.5]
  loop_sigmas: [0.1, 0.1, 0.1, 1.0, 1.0, 1.0]
da3:
  process_res: 504
  ref_view_strategy: first
