model:
  da3_model_name_or_path: "depth-anything/DA3-BASE"
  vpr_checkpoint: "checkpoints/image_retrieval/DA3_vprmodel_patchonlyadapter_aux5.ckpt"
  aux_layer: 5

  feature_adapter_arch: "patch_only"
  feature_adapter_config:
    channels: 768
    bottleneck: 640

  agg_arch: "salad"
  agg_config:
    num_channels: 768
    num_clusters: 16
    cluster_dim: 32
    token_dim: 32

  freeze:
    backbone: true
    vpr: true
    fusion: false
    head: false

  retrieval:
    strategy: "soft_attention"
    top_k: 10
    temperature: 1.0

  cross_view_fusion:
    embed_dim: 1536
    num_heads: 8
    num_layers: 2
    bidirectional: false
    dropout: 0.0

training:
  dataset: "7scenes"
  data_root: "/mnt/nas_9/group/chenguyuan/NeurIPS26/LoopAnything-dev/reloc3r/data/7scenes"
  scenes:
    - chess
    - fire
    - heads
    - office
    - pumpkin
    - redkitchen
    - stairs
  batch_size: 4
  num_workers: 8
  max_epochs: 50

  optimizer:
    name: "adamw"
    lr: 1.0e-4
    weight_decay: 1.0e-4

  scheduler:
    name: "cosine"
    T_max: 50

  loss:
    rotation_weight: 1.0
    translation_weight: 1.0

  candidate_sampling:
    pos_threshold: 1.0
    neg_threshold: 3.0
    pos_ratio: 0.7
    distance_alpha: 0.5
    scene_sampling: "round_robin"

  eval:
    eval_every_n_epoch: 5
    top_k: 10
