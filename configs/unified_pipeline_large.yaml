# DA3-LARGE-1.1 config for training-free baseline with external retrievers
# (NetVLAD / DINO-SALAD). VPR components are placeholder — da3_salad retrieval
# is NOT supported with this config because the VPR weights are BASE-dim (768).

model:
  da3_model_name_or_path: "depth-anything/DA3-LARGE-1.1"
  vpr_checkpoint: null   # No compatible VPR weights for LARGE
  aux_layer: 5
  pose_top_m: 3

  # Placeholder VPR config (not used by NetVLAD/DINO-SALAD paths).
  feature_adapter_arch: "patch_only"
  feature_adapter_config:
    channels: 1024
    bottleneck: 640

  agg_arch: "salad"
  agg_config:
    num_channels: 1024
    num_clusters: 16
    cluster_dim: 32
    token_dim: 32

  freeze:
    backbone: true
    vpr: true
    fusion: false
    head: false

  retrieval:
    strategy: "soft_attention"
    top_k: 10
    temperature: 1.0
